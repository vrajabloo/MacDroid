name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        run: ./Packaging/package-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacDroid-release
          path: |
            Build/MacDroid-*-macOS-arm64.zip
            Build/MacDroid-*-macOS-arm64.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Build/MacDroid-*-macOS-arm64.zip
            Build/MacDroid-*-macOS-arm64.zip.sha256
